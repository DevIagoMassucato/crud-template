spring:

  application:
    name: crud-template

  datasource:
    url: jdbc:h2:mem:embank
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console

  output:
    ansi:
      enabled: ALWAYS

server:
  port: 8080

